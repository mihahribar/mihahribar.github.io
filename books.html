---
layout: default
title: Books
---

{% assign books_by_year = site.data.books | group_by: "year" | sort: "name" | reverse %}
{% for year in books_by_year %}
<section id="books">
	<h1>Books I've Read in {{ year.name }}</h1>
	<ul>
		{% for book in year.items %}
		<li class="book-item">
			<a href="{{ book.goodreads_url }}" target="_blank">
				<img src="/images/books/{{ book.image }}" alt="{{ book.title }}" />
			</a>
		</li>
		{% endfor %}
	</ul>
</section>
{% endfor %}
